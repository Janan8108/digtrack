<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigTrack - Public Works Transparency</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Calibri,sans-serif;background:#f4f6fa;color:#1b2a41}
header{background:#0b1f3a;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:20px}header h1 span{color:#f5a623}.legend span{margin-left:12px;font-size:13px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px}
main{display:flex;height:calc(100vh - 56px)}#map{flex:1;min-height:300px}
aside{width:360px;overflow-y:auto;padding:14px;background:#fff;border-left:1px solid #dde3ec}
.card{background:#f4f6fa;border:1px solid #dde3ec;border-radius:10px;padding:12px;margin-bottom:14px}
h3{margin:0 0 8px;font-size:16px}label{display:block;font-size:12px;color:#6b7a90;margin-top:8px}
input,select,textarea{width:100%;padding:8px;border:1px solid #c9d2df;border-radius:6px;font:inherit}
button{margin-top:10px;background:#0b1f3a;color:#fff;border:0;padding:9px 14px;border-radius:6px;cursor:pointer;font:inherit}
button.amber{background:#f5a623;color:#0b1f3a;font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;color:#fff;font-size:12px;font-weight:600}
.warn{background:#fdeaea;border:1px solid #e5484d;color:#8a1c1f;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.ok{background:#e6f6ee;border:1px solid #2fb171;color:#13633e;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.rep{border-top:1px solid #dde3ec;padding:6px 0;font-size:13px}.muted{color:#6b7a90;font-size:13px}
@media(max-width:800px){main{flex-direction:column;height:auto}#map{height:360px;flex:none}aside{width:100%}}
</style></head><body>
<header><h1>Dig<span>Track</span> &middot; Public Works Transparency</h1>
<div class="legend"><span><i class="dot" style="background:#e5484d"></i>Delayed</span><span><i class="dot" style="background:#f5a623"></i>Ongoing</span><span><i class="dot" style="background:#2fb171"></i>Completed</span></div></header>
<main><div id="map"></div>
<aside>
<div class="card" id="detail"><h3>Project details</h3><p class="muted">Click any pin on the map to see who is working, why, and until when.</p></div>
<div class="card"><h3>Citizen report</h3>
<label>Project</label><select id="rp"></select>
<label>Your name</label><input id="rn" placeholder="Optional">
<label>What do you see?</label><select id="rt"><option>Work is ongoing</option><option>Work has stalled</option><option>Work is poorly done</option><option>Work is completed</option></select>
<label>Comment</label><textarea id="rc" rows="2" placeholder="Describe the situation"></textarea>
<button onclick="addReport()">Submit report</button><div id="rmsg"></div></div>
<div class="card"><h3>Department: add project</h3>
<p class="muted">Click on the map to choose the location.</p>
<label>Title</label><input id="nt" placeholder="e.g. Pipeline repair, Beach Rd">
<label>Department</label><select id="nd"><option>Water Board</option><option>Road Department</option><option>Storm Water Drains</option><option>Telecom</option><option>Electricity Board</option></select>
<label>Start date</label><input type="date" id="ns" value="2026-10-18"><label>End date</label><input type="date" id="ne" value="2026-10-30">
<div class="muted" id="loc">Location: not selected</div>
<button class="amber" onclick="addProject()">Add project</button><div id="nmsg"></div></div>
</aside></main>
<script>
const COL={Delayed:'#e5484d',Ongoing:'#f5a623',Completed:'#2fb171'};
let P=[
{id:1,t:'Pipeline laying, 2nd Avenue',d:'Water Board',c:'Sri Murugan Constructions',why:'Replace old drinking-water mains',s:'2026-09-20',e:'2026-10-05',st:'Delayed',delay:'Pipe stock not delivered',lat:13.0850,lng:80.2101},
{id:2,t:'Storm drain, Usman Road',d:'Storm Water Drains',c:'Chennai Infra Pvt Ltd',why:'Prevent monsoon waterlogging',s:'2026-10-01',e:'2026-10-25',st:'Ongoing',delay:'',lat:13.0418,lng:80.2341},
{id:3,t:'Road relaying, Gandhi Nagar',d:'Road Department',c:'Metro Roadworks',why:'Resurface damaged road',s:'2026-10-05',e:'2026-10-20',st:'Ongoing',delay:'',lat:13.0067,lng:80.2570},
{id:4,t:'Cable laying, Main Road',d:'Telecom',c:'FiberNet Services',why:'Broadband fibre network',s:'2026-08-15',e:'2026-09-10',st:'Completed',delay:'',lat:12.9815,lng:80.2180},
{id:5,t:'Junction repair, Kathipara',d:'Road Department',c:'Highway Builders',why:'Repair bridge joints',s:'2026-09-01',e:'2026-09-30',st:'Delayed',delay:'Heavy rain halted work',lat:12.9930,lng:80.2200},
{id:6,t:'Drain desilting, Church Road',d:'Storm Water Drains',c:'Chennai Infra Pvt Ltd',why:'Clear blocked drains before monsoon',s:'2026-10-03',e:'2026-10-15',st:'Ongoing',delay:'',lat:13.0339,lng:80.2680},
{id:7,t:'Water main extension, GST Road',d:'Water Board',c:'Sri Murugan Constructions',why:'Supply to new layouts',s:'2026-10-08',e:'2026-11-05',st:'Ongoing',delay:'',lat:12.9249,lng:80.1275},
{id:8,t:'Footpath rebuild, Barracks Road',d:'Road Department',c:'Metro Roadworks',why:'Pedestrian safety',s:'2026-08-20',e:'2026-09-15',st:'Completed',delay:'',lat:13.1143,lng:80.2329}];
let R=JSON.parse(localStorage.getItem('dt_reports')||'[]'),picked=null,tmp=null,pend=false,markers={};
const map=L.map('map').setView([13.03,80.23],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){Object.values(markers).forEach(m=>map.removeLayer(m));markers={};
P.forEach(p=>{const m=L.circleMarker([p.lat,p.lng],{radius:11,color:'#fff',weight:2,fillColor:COL[p.st],fillOpacity:.95}).addTo(map).bindTooltip(esc(p.t));m.on('click',()=>show(p.id));markers[p.id]=m});
document.getElementById('rp').innerHTML=P.map(p=>`<option value="${p.id}">${esc(p.t)}</option>`).join('')}
function days(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function show(id){const p=P.find(x=>x.id==id);document.getElementById('rp').value=id;
const rs=R.filter(r=>r.pid==id);
document.getElementById('detail').innerHTML=`<h3>${esc(p.t)}</h3><span class="badge" style="background:${COL[p.st]}">${p.st}</span>
<p><b>Department:</b> ${esc(p.d)}<br><b>Contractor:</b> ${esc(p.c)}<br><b>Purpose:</b> ${esc(p.why)}<br><b>Timeline:</b> ${p.s} to ${p.e} (${days(p.s,p.e)} days)</p>
${p.delay?`<div class="warn"><b>Delay reason:</b> ${esc(p.delay)}</div>`:''}
<h3 style="margin-top:12px">Citizen reports (${rs.length})</h3>${rs.length?rs.map(r=>`<div class="rep"><b>${esc(r.n||'Anonymous')}</b> &middot; ${esc(r.t)}<br>${esc(r.c)}</div>`).join(''):'<p class="muted">No reports yet.</p>'}`;
map.setView([p.lat,p.lng],14)}
function addReport(){const c=document.getElementById('rc').value.trim(),m=document.getElementById('rmsg');
if(!c){m.innerHTML='<div class="warn">Please add a comment.</div>';return}
R.push({pid:+document.getElementById('rp').value,n:document.getElementById('rn').value.trim(),t:document.getElementById('rt').value,c});
try{localStorage.setItem('dt_reports',JSON.stringify(R))}catch(e){}
document.getElementById('rc').value='';m.innerHTML='<div class="ok">Thank you! Your report was added.</div>';show(document.getElementById('rp').value)}
map.on('click',e=>{picked=e.latlng;if(tmp)map.removeLayer(tmp);tmp=L.marker(e.latlng).addTo(map);pend=false;
document.getElementById('loc').textContent='Location: '+e.latlng.lat.toFixed(4)+', '+e.latlng.lng.toFixed(4)});
function dist(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function addProject(){const m=document.getElementById('nmsg'),t=document.getElementById('nt').value.trim(),s=document.getElementById('ns').value,e=document.getElementById('ne').value;
if(!t||!s||!e||!picked){m.innerHTML='<div class="warn">Enter title, dates and click a location on the map.</div>';return}
if(e<s){m.innerHTML='<div class="warn">End date cannot be before start date.</div>';return}
const cf=P.filter(p=>p.st!=='Completed'&&dist(p.lat,p.lng,picked.lat,picked.lng)<500&&s<=p.e&&e>=p.s);
if(cf.length&&!pend){pend=true;m.innerHTML='<div class="warn"><b>Conflict detected!</b> Within 500 m with overlapping dates:<br>'+cf.map(p=>'&bull; '+esc(p.t)+' ('+esc(p.d)+', '+p.s+' to '+p.e+')').join('<br>')+'<br>Coordinate with them. Click "Add project" again to proceed anyway.</div>';return}
P.push({id:Date.now(),t,d:document.getElementById('nd').value,c:'To be assigned',why:'Newly planned work',s,e,st:'Ongoing',delay:'',lat:picked.lat,lng:picked.lng});
pend=false;if(tmp){map.removeLayer(tmp);tmp=null}picked=null;document.getElementById('nt').value='';document.getElementById('loc').textContent='Location: not selected';
m.innerHTML='<div class="ok">Project added to the map.</div>';draw()}
draw();
</script></body></html>
